  mysql:
    image: mysql
    container_name: gluttex-db
    restart: always
    command: --max_allowed_packet=256M --init-file /data/application/init.sql

    environment:
      MYSQL_DATABASE: ${SQL_DATABASE}
      MYSQL_USER: ${SQL_USER}
      MYSQL_ROOT_PASSWORD: ${SQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${SQL_PASSWORD}
      
    ports:
      - ${SQL_PORT}:3306
    volumes:
      - ./setup/mysql/model.sql:/data/application/init.sql
      - ./volumes/data:/var/lib/mysql
    networks:
      - gluttex-net
  gluttex-api:
    container_name: gluttex-api
    hostname: gluttex-api
    restart: unless-stopped
    build:
      context: ./api_server
      dockerfile: ./Dockerfile.dev
      args:
        - API_PORT=${API_PORT}
    command: uvicorn server:app --host 0.0.0.0 --port ${API_PORT} --reload
    image: omarzos/gluttex-api
    ports:
      - ${API_PORT}
    environment:
      - API_PORT=${API_PORT}
      - SQL_SCHEMA=${SQL_SCHEMA}
      - SQL_HOST=${SQL_HOST}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_ROOT_PASSWORD}
      - SQL_PORT=3306
      - AUTH_PORT=${AUTH_PORT}
      - AUTH_SERVER_NAME=${AUTH_SERVER_NAME}
      - AUTH_REGISTRATION_ENDPOINT=${AUTH_REGISTRATION_ENDPOINT}
      - AUTH_LOGIN_ENDPOINT=${AUTH_LOGIN_ENDPOINT}
      - AUTH_DELETE_ENDPOINT=${AUTH_DELETE_ENDPOINT}
      - AUTH_ALGORITHM=${AUTH_ALGORITHM}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - API_ALGORITHM=${API_ALGORITHM}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - AUTH_CHANGE_ENDPOINT=${AUTH_CHANGE_ENDPOINT}
      - FILE_UPLOAD_ENDPOINT=${FILE_UPLOAD_ENDPOINT}
      - FS_HOST=${FS_HOST}
      - FS_PORT=${FS_PORT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      - AUTH_SERVER_PROTOCOLE=${AUTH_SERVER_PROTOCOLE}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - SILO_SERVER_PROTOCOLE=${SILO_SERVER_PROTOCOLE}
      - SILO_SERVER_NAME=${SILO_SERVER_NAME}
      - SILO_SERVER_PORT=${SILO_SERVER_PORT}
      - SILO_SERVER_PREFIX=${SILO_SERVER_PREFIX}
      - FINANCE_SERVER_PROTOCOLE=${FINANCE_SERVER_PROTOCOLE}
      - FINANCE_SERVER_NAME=${FINANCE_SERVER_NAME}
      - FINANCE_SERVER_PORT=${FINANCE_SERVER_PORT}
      - FINANCE_SERVER_PREFIX=${FINANCE_SERVER_PREFIX}
      
    networks:
      - gluttex-net
    volumes:
      - ./api_server:/code
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
  
  gluttex-auth:
    container_name: gluttex-auth
    hostname: gluttex-auth
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 9090 --reload # 
    image: omarzos/emastan-auth:latest
    environment:
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - AUTH_PORT=9090
      - API_SECRET_KEY=${AUTH_SECRET_KEY}
      - API_ALGORITHM=${AUTH_ALGORITHM}
      - AUTH_DATABASE_URL=sqlite:///../auth_db/auth_db_data.db
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
    ports:
      - 9090:9090
    networks:
      - gluttex-net
    # volumes:
    #   - ./volumes/auth_db/:/auth_db/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  gluttex-finance:
    container_name: gluttex-finance
    hostname: gluttex-finance
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port ${FINANCE_SERVER_PORT} --reload
    image: omarzos/finance-api:latest
    ports:
      - ${FINANCE_SERVER_PORT}
    environment:
      - FINANCE_PORT=${FINANCE_SERVER_PORT}
      - SQL_SCHEMA=${SQL_SCHEMA}
      - SQL_HOST=${SQL_HOST}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_PORT=3306
    networks:
      - gluttex-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  gluttex-silo:
    container_name: gluttex-silo
    hostname: gluttex-silo
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port ${SILO_SERVER_PORT} 
    image: omarzos/esilo-api:latest
    ports:
      - ${SILO_SERVER_PORT}
    environment:
      - ESILO_PORT=${SILO_SERVER_PORT}
      - SQL_SCHEMA=${SQL_SCHEMA}
      - SQL_HOST=${SQL_HOST}
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_PORT=3306
    networks:
      - gluttex-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  gluttex-fs:
    container_name: gluttex-fs
    hostname: gluttex-fs
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port ${FS_PORT} --reload
    image: omarzos/emagrad-fs:latest
    ports:
      - ${FS_PORT}
    environment:
      - FS_PORT=${FS_PORT}
      - FS_BASE_STORAGE=${FS_BASE_STORAGE}
      - FS_CACHE_STORAGE=${FS_CACHE_STORAGE}
    networks:
      - gluttex-net
    # volumes:
    #   - ./volumes/fs/:/fs/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # gluttex-stream:
